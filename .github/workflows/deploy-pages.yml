name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/configure-pages@v5

      - name: Stage public files (exclude private submodules)
        run: |
          mkdir -p _site
          while IFS= read -r -d '' file; do
            case "$file" in
              .gitmodules|projects/computational-methods|projects/computational-methods/*|projects/environmental-quality-engineering|projects/environmental-quality-engineering/*|.github/*)
                continue
                ;;
            esac
            if [ -f "$file" ]; then
              mkdir -p "_site/$(dirname "$file")"
              cp "$file" "_site/$file"
            fi
          done < <(git ls-files -z)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
